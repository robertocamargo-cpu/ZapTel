<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZapTel Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0d11;
            --surface: rgba(255, 255, 255, 0.03);
            --surface-hover: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.08);
            --text: #f4f4f5;
            --text-dim: #a1a1aa;
            --chumbo-1: rgba(255, 255, 255, 0.01);
            --chumbo-2: rgba(255, 255, 255, 0.04);
            --accent-tel: #818cf8;
            --accent-zap: #22c55e;
            --accent-purple: #a855f7;
            --accent-amber: #fbbf24;
            --radius: 16px;
            --radius-sm: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 40px 24px;
            line-height: 1.5;
        }

        .container { max-width: 1600px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 24px;
        }

        .header-titles h1 { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
        .header-titles .subtitle { color: var(--text-dim); font-size: 14px; }

        .date-filter {
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--surface);
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid var(--border);
        }

        .date-filter input { background: transparent; border: none; color: var(--text); font-weight: 600; outline: none; }
        .filter-btn { background: var(--text); color: var(--bg); border: none; padding: 6px 20px; border-radius: 20px; font-weight: 700; cursor: pointer; }

        .summary-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
        .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; position: relative; overflow: hidden; }
        .summary-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
        .summary-card.tel::before { background: var(--accent-tel); }
        .summary-card.zap::before { background: var(--accent-zap); }
        .summary-card.most::before { background: var(--accent-purple); }

        .summary-card h3 { 
            font-size: 12px; 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            margin-bottom: 15px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .breakout-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .breakout-item { text-align: center; padding: 15px 10px; border-radius: var(--radius-sm); background: rgba(255, 255, 255, 0.02); border: 1px solid transparent; }
        .breakout-item.highlight { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.05); }
        .breakout-val { font-size: 28px; font-weight: 800; display: block; line-height: 1; margin-bottom: 8px; }
        .breakout-label { font-size: 10px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; opacity: 0.7; }

        .table-wrapper { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { padding: 12px 8px; text-transform: uppercase; font-size: 10px; font-weight: 800; border-bottom: 1px solid var(--border); cursor: pointer; }
        th:hover { background: rgba(255,255,255,0.05); }
        td { padding: 14px 10px; border-bottom: 1px solid rgba(255,255,255,0.03); text-align: center; }
        
        .col-group-1 { background-color: var(--chumbo-1); }
        .col-group-2 { background-color: var(--chumbo-2); }

        .name-cell { display: flex; align-items: center; gap: 12px; text-align: left; padding-left: 10px; }
        .avatar { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: white; }
        .name-info .name { font-weight: 700; font-size: 14px; }
        .name-info .sub { font-size: 11px; color: var(--text-dim); }

        .waiting-badge { background: var(--accent-amber); color: #000; width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .totals-row td { background: rgba(255,255,255,0.05) !important; font-weight: 800; border-top: 2px solid var(--border); }
        .footer { margin-top: 40px; text-align: center; color: var(--text-dim); font-size: 12px; }
        
        .sort-icon { margin-left: 4px; opacity: 0.3; }
        th.active .sort-icon { opacity: 1; }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-titles">
                <h1>📊 ZapTel Dashboard</h1>
                <div class="subtitle">Controle de Performance — Telefonia, WhatsApp & Mostruários</div>
            </div>
            <div class="date-filter">
                <input type="date" id="dateFrom">
                <span style="color: var(--text-dim)">até</span>
                <input type="date" id="dateTo">
                <button class="filter-btn" onclick="applyFilter()">Filtrar</button>
            </div>
        </div>

        <div id="summary-container" class="summary-row"></div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr style="height: 40px;">
                        <th rowspan="2" style="text-align: left; padding-left: 20px;" onclick="toggleSort('name')">Operador / Ramal <span class="sort-icon">↕</span></th>
                        <th colspan="3" class="col-group-1" style="color: var(--accent-tel)">📞 Telefonia</th>
                        <th colspan="3" class="col-group-2" style="color: var(--accent-tel)">⏳ Tempo Total</th>
                        <th colspan="3" class="col-group-1" style="color: var(--accent-zap)">💬 Conversas</th>
                        <th colspan="3" class="col-group-2" style="color: var(--accent-zap)">✅ Finalizados</th>
                        <th colspan="2" class="col-group-1" style="color: var(--accent-amber)">🔄 Status</th>
                        <th colspan="3" class="col-group-2" style="color: var(--accent-purple)">📦 Mostruários</th>
                    </tr>
                    <tr id="dynamic-headers" style="font-size: 9px; color: var(--text-dim);">
                        <!-- Preenchido pelo JS -->
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>

        <div class="footer">
            Atualizado em <span id="last-update">--/--/---- --:--</span> · Telefonia Outbound > 30s
        </div>
    </div>

    <script>
        let RAW_DATA = null;
        let CURRENT_SORT = { key: 'score', dir: 'desc' };

        const NAME_JOINER = {
            'Arnaldo': 'Arnaldo Acerbi', 'Arnaldo César': 'Arnaldo Acerbi', 'Arnaldo Acerbi': 'Arnaldo Acerbi',
            'Aurora': 'Aurora Dutra', 'Aurora Dutra': 'Aurora Dutra',
            'Juliana': 'Juliana Sanches', 'Juliana Sanches': 'Juliana Sanches',
            'Paulo': 'Paulo Vinicius', 'Paulo Vinicius': 'Paulo Vinicius',
            'Poliane': 'Poliane Medeiros', 'Poliane Medeiros': 'Poliane Medeiros',
            'Angelita': 'Angelita Francisco', 'Angelita Francisco': 'Angelita Francisco',
            'Roberto': 'Roberto Camargo', 'Roberto Camargo': 'Roberto Camargo'
        };

        const AVATAR_COLORS = {
            'Arnaldo Acerbi': ['#6366f1', '#818cf8'], 'Aurora Dutra': ['#8b5cf6', '#a78bfa'],
            'Ana Helena': ['#ec4899', '#f472b6'], 'Juliana Sanches': ['#f97316', '#fb923c'],
            'Fernando': ['#06b6d4', '#22d3ee'], 'Paulo Vinicius': ['#14b8a6', '#2dd4bf'],
            'Angelita Francisco': ['#f43f5e', '#fb7185'], 'Alessandra': ['#a855f7', '#c084fc'],
            'Roberto Camargo': ['#0ea5e9', '#38bdf8'], 'Vinicius': ['#84cc16', '#a3e635'],
            'Poliane Medeiros': ['#e879f9', '#f0abfc'], 'Sem atendente': ['#64748b', '#94a3b8']
        };

        function formatYMD(date) {
            return date.toISOString().split('T')[0];
        }

        function toggleSort(key) {
            if (CURRENT_SORT.key === key) CURRENT_SORT.dir = CURRENT_SORT.dir === 'desc' ? 'asc' : 'desc';
            else { CURRENT_SORT.key = key; CURRENT_SORT.dir = 'desc'; }
            applyFilter();
        }

        function render(data) {
            const now = new Date();
            const yesterdayDate = new Date(now);
            yesterdayDate.setDate(now.getDate() - 1);
            const yesterday = formatYMD(yesterdayDate);
            
            const thisMonth = yesterday.substring(0, 7);
            const prevMonthDate = new Date(yesterdayDate);
            prevMonthDate.setMonth(prevMonthDate.getMonth() - 1);
            const prevMonth = formatYMD(prevMonthDate).substring(0, 7);

            // Cabeçalhos Dinâmicos
            const labels = {
                ontem: yesterday.split('-').reverse().join('/').substring(0,5),
                mes: thisMonth.split('-').reverse().join('/'),
                pass: prevMonth.split('-').reverse().join('/')
            };

            const headerHtml = `
                <th class="col-group-1" onclick="toggleSort('tel_ontem')">${labels.ontem} <span class="sort-icon">↕</span></th>
                <th class="col-group-1" onclick="toggleSort('tel_mes')">${labels.mes} <span class="sort-icon">↕</span></th>
                <th class="col-group-1" onclick="toggleSort('tel_pass')">${labels.pass} <span class="sort-icon">↕</span></th>
                <th class="col-group-2" onclick="toggleSort('tempo_ontem')">${labels.ontem} <span class="sort-icon">↕</span></th>
                <th class="col-group-2" onclick="toggleSort('tempo_mes')">${labels.mes} <span class="sort-icon">↕</span></th>
                <th class="col-group-2" onclick="toggleSort('tempo_pass')">${labels.pass} <span class="sort-icon">↕</span></th>
                <th class="col-group-1" onclick="toggleSort('zap_ontem')">${labels.ontem} <span class="sort-icon">↕</span></th>
                <th class="col-group-1" onclick="toggleSort('zap_mes')">${labels.mes} <span class="sort-icon">↕</span></th>
                <th class="col-group-1" onclick="toggleSort('zap_pass')">${labels.pass} <span class="sort-icon">↕</span></th>
                <th class="col-group-2" onclick="toggleSort('fin_ontem')">${labels.ontem} <span class="sort-icon">↕</span></th>
                <th class="col-group-2" onclick="toggleSort('fin_mes')">${labels.mes} <span class="sort-icon">↕</span></th>
                <th class="col-group-2" onclick="toggleSort('fin_pass')">${labels.pass} <span class="sort-icon">↕</span></th>
                <th class="col-group-1" onclick="toggleSort('abertos')">Abertos <span class="sort-icon">↕</span></th>
                <th class="col-group-1" onclick="toggleSort('aguard')">Aguard. <span class="sort-icon">↕</span></th>
                <th class="col-group-2" onclick="toggleSort('most_ontem')">${labels.ontem} <span class="sort-icon">↕</span></th>
                <th class="col-group-2" onclick="toggleSort('most_mes')">${labels.mes} <span class="sort-icon">↕</span></th>
                <th class="col-group-2" onclick="toggleSort('most_pass')">${labels.pass} <span class="sort-icon">↕</span></th>
            `;
            document.getElementById('dynamic-headers').innerHTML = headerHtml;

            const ops = {};
            const totals = { 
                tel: { ontem: 0, mes: 0, pass: 0 }, tempo: { ontem: 0, mes: 0, pass: 0 },
                zap: { ontem: 0, mes: 0, pass: 0 }, fin: { ontem: 0, mes: 0, pass: 0 },
                most: { ontem: 0, mes: 0, pass: 0 }, abertos: 0, aguard: 0
            };

            const getOp = (name, ramal) => {
                const fullName = NAME_JOINER[name] || name;
                if (!ops[fullName]) {
                    ops[fullName] = {
                        name: fullName, sub: ramal ? `Ramal ${ramal}` : 'WhatsApp',
                        tel_ontem:0, tel_mes:0, tel_pass:0, tempo_ontem:0, tempo_mes:0, tempo_pass:0,
                        zap_ontem:0, zap_mes:0, zap_pass:0, fin_ontem:0, fin_mes:0, fin_pass:0,
                        most_ontem:0, most_mes:0, most_pass:0, abertos:0, aguard:0, score:0
                    };
                }
                return ops[fullName];
            };

            data.telefonia.forEach(r => {
                const op = getOp(r.nome, r.ramal);
                if (r.data === yesterday) { op.tel_ontem++; op.tel_mes++; op.tempo_ontem+=r.tempo_seg; op.tempo_mes+=r.tempo_seg; totals.tel.ontem++; totals.tel.mes++; totals.tempo.ontem+=r.tempo_seg; totals.tempo.mes+=r.tempo_seg; }
                else if (r.data.startsWith(thisMonth)) { op.tel_mes++; op.tempo_mes+=r.tempo_seg; totals.tel.mes++; totals.tempo.mes+=r.tempo_seg; }
                else if (r.data.startsWith(prevMonth)) { op.tel_pass++; op.tempo_pass+=r.tempo_seg; totals.tel.pass++; totals.tempo.pass+=r.tempo_seg; }
            });

            data.whatsapp.forEach(r => {
                const op = getOp(r.atendente || 'Sem atendente');
                if (r.data === yesterday) { op.zap_ontem++; op.zap_mes++; totals.zap.ontem++; totals.zap.mes++; if(r.status==='FINALIZADO') { op.fin_ontem++; op.fin_mes++; totals.fin.ontem++; totals.fin.mes++; } }
                else if (r.data.startsWith(thisMonth)) { op.zap_mes++; totals.zap.mes++; if(r.status==='FINALIZADO') { op.fin_mes++; totals.fin.mes++; } }
                else if (r.data.startsWith(prevMonth)) { op.zap_pass++; totals.zap.pass++; if(r.status==='FINALIZADO') { op.fin_pass++; totals.fin.pass++; } }
                if (r.status === 'ATIVO') { op.abertos++; totals.abertos++; }
                if (r.status === 'AGUARDANDO') { op.aguard++; totals.aguard++; }
            });

            data.mostruario.forEach(r => {
                const op = getOp(r.vendedor);
                if (r.data === yesterday) { op.most_ontem++; op.most_mes++; totals.most.ontem++; totals.most.mes++; }
                else if (r.data.startsWith(thisMonth)) { op.most_mes++; totals.most.mes++; }
                else if (r.data.startsWith(prevMonth)) { op.most_pass++; totals.most.pass++; }
            });

            Object.values(ops).forEach(op => op.score = op.tel_mes + op.zap_mes + op.most_mes);

            // Summary Render
            document.getElementById('summary-container').innerHTML = `
                <div class="summary-card tel">
                    <h3>📞 Telefonia</h3>
                    <div class="breakout-grid">
                        <div class="breakout-item highlight"><span class="breakout-val" style="color: var(--accent-tel)">${totals.tel.ontem}</span><span class="breakout-label">${labels.ontem}</span></div>
                        <div class="breakout-item"><span class="breakout-val">${totals.tel.mes}</span><span class="breakout-label">${labels.mes}</span></div>
                        <div class="breakout-item"><span class="breakout-val" style="opacity:0.6">${totals.tel.pass}</span><span class="breakout-label">${labels.pass}</span></div>
                    </div>
                </div>
                <div class="summary-card zap">
                    <h3>💬 WhatsApp</h3>
                    <div class="breakout-grid">
                        <div class="breakout-item highlight"><span class="breakout-val" style="color: var(--accent-zap)">${totals.zap.ontem}</span><span class="breakout-label">${labels.ontem}</span></div>
                        <div class="breakout-item"><span class="breakout-val">${totals.zap.mes}</span><span class="breakout-label">${labels.mes}</span></div>
                        <div class="breakout-item"><span class="breakout-val" style="opacity:0.6">${totals.zap.pass}</span><span class="breakout-label">${labels.pass}</span></div>
                    </div>
                </div>
                <div class="summary-card most">
                    <h3>📦 Mostruários</h3>
                    <div class="breakout-grid">
                        <div class="breakout-item highlight"><span class="breakout-val" style="color: var(--accent-purple)">${totals.most.ontem}</span><span class="breakout-label">${labels.ontem}</span></div>
                        <div class="breakout-item"><span class="breakout-val">${totals.most.mes}</span><span class="breakout-label">${labels.mes}</span></div>
                        <div class="breakout-item"><span class="breakout-val" style="opacity:0.6">${totals.most.pass}</span><span class="breakout-label">${labels.pass}</span></div>
                    </div>
                </div>
            `;

            const rows = Object.values(ops).sort((a,b) => {
                let vA = a[CURRENT_SORT.key], vB = b[CURRENT_SORT.key];
                if (vA < vB) return CURRENT_SORT.dir === 'desc' ? 1 : -1;
                if (vA > vB) return CURRENT_SORT.dir === 'desc' ? -1 : 1;
                return 0;
            });

            let html = '';
            rows.forEach(op => {
                const colors = AVATAR_COLORS[op.name] || ['#666','#999'];
                html += `
                    <tr>
                        <td><div class="name-cell">
                            <div class="avatar" style="background:linear-gradient(135deg,${colors[0]},${colors[1]})">${op.name.split(' ').map(n=>n[0]).join('').substring(0,2)}</div>
                            <div class="name-info"><div class="name">${op.name}</div><div class="sub">${op.sub}</div></div>
                        </div></td>
                        <td class="col-group-1"><b>${op.tel_ontem}</b></td><td class="col-group-1"><b>${op.tel_mes}</b></td><td class="col-group-1" style="opacity:0.6">${op.tel_pass}</td>
                        <td class="col-group-2">${Math.floor(op.tempo_ontem/60)}m</td><td class="col-group-2">${Math.floor(op.tempo_mes/60)}m</td><td class="col-group-2" style="opacity:0.6">${Math.floor(op.tempo_pass/60)}m</td>
                        <td class="col-group-1" style="color:var(--accent-zap)"><b>${op.zap_ontem}</b></td><td class="col-group-1" style="color:var(--accent-zap)"><b>${op.zap_mes}</b></td><td class="col-group-1" style="opacity:0.6">${op.zap_pass}</td>
                        <td class="col-group-2" style="color:var(--accent-tel)"><b>${op.fin_ontem}</b></td><td class="col-group-2" style="color:var(--accent-tel)"><b>${op.fin_mes}</b></td><td class="col-group-2" style="opacity:0.6">${op.fin_pass}</td>
                        <td class="col-group-1"><b>${op.abertos}</b></td>
                        <td class="col-group-1">${op.aguard > 0 ? `<div class="waiting-badge">${op.aguard}</div>` : '0'}</td>
                        <td class="col-group-2" style="color:var(--accent-purple)"><b>${op.most_ontem}</b></td><td class="col-group-2" style="color:var(--accent-purple)"><b>${op.most_mes}</b></td><td class="col-group-2" style="opacity:0.6">${op.most_pass}</td>
                    </tr>
                `;
            });

            html += `<tr class="totals-row">
                <td style="text-align:left; padding-left:20px;">TOTAL GERAL</td>
                <td class="col-group-1">${totals.tel.ontem}</td><td class="col-group-1">${totals.tel.mes}</td><td class="col-group-1">${totals.tel.pass}</td>
                <td class="col-group-2">${Math.floor(totals.tempo.ontem/60)}m</td><td class="col-group-2">${Math.floor(totals.tempo.mes/60)}m</td><td class="col-group-2">${Math.floor(totals.tempo.pass/60)}m</td>
                <td class="col-group-1">${totals.zap.ontem}</td><td class="col-group-1">${totals.zap.mes}</td><td class="col-group-1">${totals.zap.pass}</td>
                <td class="col-group-2">${totals.fin.ontem}</td><td class="col-group-2">${totals.fin.mes}</td><td class="col-group-2">${totals.fin.pass}</td>
                <td class="col-group-1">${totals.abertos}</td><td class="col-group-1">${totals.aguard}</td>
                <td class="col-group-2">${totals.most.ontem}</td><td class="col-group-2">${totals.most.mes}</td><td class="col-group-2">${totals.most.pass}</td>
            </tr>`;
            document.getElementById('table-body').innerHTML = html;
            document.getElementById('last-update').textContent = new Date().toLocaleString('pt-BR');
        }

        function applyFilter() {
            const from = document.getElementById('dateFrom').value, to = document.getElementById('dateTo').value;
            render({
                telefonia: RAW_DATA.telefonia.filter(r => (!from || r.data >= from) && (!to || r.data <= to)),
                whatsapp: RAW_DATA.whatsapp.filter(r => (!from || r.data >= from) && (!to || r.data <= to)),
                mostruario: RAW_DATA.mostruario.filter(r => (!from || r.data >= from) && (!to || r.data <= to))
            });
        }

        fetch('full_data.json?t=' + Date.now()).then(r => r.json()).then(data => {
            RAW_DATA = data;
            document.getElementById('dateFrom').value = data.date_range.min;
            document.getElementById('dateTo').value = data.date_range.max;
            render(data);
        });
    </script>
</body>
</html>
